name: Mettre à jour les arrêts Vitalis

on:
  workflow_dispatch:
  schedule:
    - cron: "50 4 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger le GTFS officiel Vitalis
        run: |
          curl -L --fail "https://data.grandpoitiers.fr/data-fair/api/v1/datasets/offre-de-transport-du-reseau-vitalis/metadata-attachments/gtfs.zip" -o /tmp/vitalis-gtfs.zip
      - name: Préparer les arrêts pour Libcomlair
        run: python scripts/import-arrets-bus.py /tmp/vitalis-gtfs.zip
      - name: Enregistrer les données mises à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arrets-bus-officiels.json
          git diff --cached --quiet || git commit -m "Mettre à jour les arrêts Vitalis"
          git push
