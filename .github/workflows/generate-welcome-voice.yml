name: Generate welcome voice test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-welcome:
    name: Generate Estelle welcome WAV
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5.0"

      - name: Install Pocket TTS 3.3.0 and dependencies
        run: python -m pip install "pocket-tts==3.3.0"

      - name: Show pinned environment
        run: |
          python --version
          python -m pip show pocket-tts tokenizers torch

      - name: Generate only welcome.main
        run: |
          python scripts/generate-fixed-voice-pack-pocket-tts.py \
            --single welcome.main \
            --output-dir voice-test-output \
            --overwrite

      - name: Verify generated files
        run: |
          test -s voice-test-output/welcome-main.wav
          test -s voice-test-output/generated-pack-v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('voice-test-output/generated-pack-v1.json').read_text(encoding='utf-8'))
          assert report['status'] == 'generated-not-approved'
          assert len(report['entries']) == 1
          assert report['entries'][0]['id'] == 'welcome.main'
          assert report['entries'][0]['wav']['sampleRate'] == 24000
          assert report['entries'][0]['wav']['channels'] == 1
          print('Voice artifact verified:', report['entries'][0]['sha256'])
          PY

      - name: Upload voice test artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcomlair-estelle-welcome-test
          path: |
            voice-test-output/welcome-main.wav
            voice-test-output/generated-pack-v1.json
          if-no-files-found: error
          retention-days: 7
