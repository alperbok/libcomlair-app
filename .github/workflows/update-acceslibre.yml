name: Préparer les données Acceslibre

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * 1"

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Télécharger et préparer un échantillon réel
        run: |
          mkdir -p data
          curl -L --fail "https://www.data.gouv.fr/api/1/datasets/r/93ae96a7-1db7-4cb4-a9f1-6d778370b640" -o /tmp/acceslibre.csv
          python scripts/build_acceslibre_sample.py /tmp/acceslibre.csv data/acceslibre-poitiers.json
      - name: Enregistrer les données mises à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/acceslibre-poitiers.json
          git diff --cached --quiet || git commit -m "Mettre à jour les données Acceslibre"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
