name: Build Libcomlair Android native

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-native/**"
      - "voice-tests/fr-FR/vera-welcome.wav"
      - ".github/workflows/build-android-native.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build native debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify Vera is bundled source
        run: test -s voice-tests/fr-FR/vera-welcome.wav

      - name: Build debug APK
        run: gradle -p android-native :app:assembleDebug --stacktrace

      - name: Verify APK
        run: test -s android-native/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: libcomlair-android-native-vera
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
