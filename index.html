<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff"><title>Libcomlair</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><div><strong>Libcomlair</strong><small>Des lieux accessibles, plus faciles à trouver</small></div></header>
<main>
<section class="hero"><h1>Trouvez un lieu accessible</h1><p>Restaurants, hôtels, loisirs et services avec des informations d’accessibilité claires.</p>
<label for="search">Rechercher un lieu ou une ville</label><input id="search" type="search" placeholder="Ex. restaurant, Poitiers…">
</section>
<section><h2>Catégories</h2><div id="categories" class="grid"></div></section>
<section><h2>Lieux</h2><div id="places" class="places"></div><p id="empty" hidden>Aucun lieu ne correspond à votre recherche.</p></section>
</main>
<footer>Libcomlair • Première version</footer>
<script src="app.js"></script>
</body></html>
