<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Libcomlair — modèle cadre maître v36</title>
<style>
:root{
  --ink:#17222b;
  --teal:#138795;
  --teal-soft:#eaf6f7;
  --line:#94c7cc;
  --bg:#f7fbfb;
  --gap:14px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Arial,Helvetica,sans-serif;color:var(--ink);overflow:hidden}
body{min-height:100dvh}
.master-shell{
  width:100%;
  height:100dvh;
  min-height:100dvh;
  max-width:820px;
  margin:0 auto;
  border:3px solid var(--ink);
  border-radius:34px 34px 0 0;
  background:#fff;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  overflow:hidden;
  padding:
    max(10px,env(safe-area-inset-top))
    16px
    max(12px,env(safe-area-inset-bottom));
}
.master-header{
  min-height:150px;
  display:grid;
  grid-template-columns:86px minmax(0,1fr) 126px;
  align-items:center;
  gap:12px;
  padding:8px 0 14px;
  border-bottom:2px solid #eef4f5;
}
.menu-btn{
  width:74px;height:96px;border:0;border-radius:18px;background:var(--teal);color:#fff;
  font-size:48px;line-height:1;box-shadow:0 6px 16px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center
}
.brand{min-width:0;display:flex;align-items:center;justify-content:center}
.brand img{display:block;max-width:100%;width:min(330px,100%);height:auto;object-fit:contain}
.mic-btn{
  width:122px;height:122px;border-radius:50%;border:7px solid #fff;background:var(--teal);color:#fff;
  box-shadow:0 6px 18px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:700;font-size:24px;line-height:1.05
}
.mic-btn .icon{font-size:46px;margin-bottom:3px}
.master-content{
  min-height:0;
  overflow:auto;
  overscroll-behavior:contain;
  padding:18px 0;
}
.content-placeholder{
  min-height:100%;
  border:3px dashed var(--line);
  border-radius:28px;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
}
.content-placeholder .box{max-width:520px}
.content-placeholder h1{margin:0 0 12px;font-size:clamp(28px,5vw,42px)}
.content-placeholder p{margin:0;font-size:clamp(18px,3.8vw,26px);line-height:1.35;color:#53636b}
.master-footer{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  padding-top:12px;
  border-top:2px solid #eef4f5;
}
.nav-btn{
  min-height:84px;border:3px solid var(--ink);border-radius:22px;background:#fff;color:#111;font-size:30px;font-weight:700
}
.nav-btn.next{background:var(--teal);color:#fff;border-color:var(--teal)}
@media (max-width:520px){
  .master-shell{border-radius:24px 24px 0 0;padding-left:12px;padding-right:12px}
  .master-header{min-height:128px;grid-template-columns:68px minmax(0,1fr) 104px;gap:8px;padding-top:4px;padding-bottom:10px}
  .menu-btn{width:62px;height:82px;border-radius:16px;font-size:40px}
  .brand img{width:min(215px,100%)}
  .mic-btn{width:100px;height:100px;border-width:6px;font-size:20px}
  .mic-btn .icon{font-size:38px}
  .master-content{padding:12px 0}
  .content-placeholder{border-radius:22px;padding:18px}
  .master-footer{gap:10px;padding-top:10px}
  .nav-btn{min-height:72px;border-radius:18px;font-size:25px}
}
@media (max-height:700px){
  .master-header{min-height:108px}
  .menu-btn{height:70px}
  .mic-btn{width:88px;height:88px;font-size:17px}.mic-btn .icon{font-size:32px}
  .master-footer{padding-top:8px}.nav-btn{min-height:62px}
}
</style>
</head>
<body>
<main class="master-shell" aria-label="Modèle de cadre maître Libcomlair">
  <header class="master-header">
    <button class="menu-btn" type="button" aria-label="Menu">☰</button>
    <div class="brand"><img src="assets/libcomlair-logo-v222.jpg?v=224-clean-source" alt="Libcomlair — Sortir en toute liberté"></div>
    <button class="mic-btn" type="button" aria-label="Micro"><span class="icon">🎙️</span><span>Micro</span></button>
  </header>

  <section class="master-content" aria-label="Zone réservée au contenu de la page">
    <div class="content-placeholder">
      <div class="box">
        <h1>Zone de contenu</h1>
        <p>Tout le contenu des futures pages sera placé uniquement ici. Cette zone peut défiler sans jamais passer sous l’en-tête ni sous les boutons de navigation.</p>
      </div>
    </div>
  </section>

  <footer class="master-footer">
    <button class="nav-btn" type="button">Retour</button>
    <button class="nav-btn next" type="button">Suivant</button>
  </footer>
</main>
</body>
</html>
