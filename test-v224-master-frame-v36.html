<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Libcomlair — modèle cadre maître v36</title>
<style>
:root{
  --ink:#17222b;
  --teal:#0f7784;
  --line:#94c7cc;
  --bg:#f7fbfb;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#fff;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
}
body{
  height:100svh;
  min-height:100svh;
  overflow:hidden;
  padding:2px;
}
.master-shell{
  width:100%;
  height:calc(100svh - 4px);
  max-width:820px;
  margin:0 auto;
  border:3px solid var(--ink);
  border-radius:26px;
  background:#fff;
  display:grid;
  grid-template-rows:82px minmax(0,1fr) 64px;
  overflow:hidden;
  padding:6px 12px 7px;
}
.master-header{
  position:relative;
  min-height:82px;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:0 82px 4px 40px;
  border-bottom:1px solid #eef4f5;
}
.menu-btn{
  position:absolute;
  left:0;
  top:5px;
  width:38px;
  min-width:38px;
  height:52px;
  min-height:52px;
  padding:0;
  border:0;
  border-radius:11px;
  background:var(--teal);
  color:#fff;
  font-size:1.2rem;
  line-height:1;
  box-shadow:0 4px 12px rgba(0,0,0,.14);
  display:flex;
  align-items:center;
  justify-content:center;
}
.brand{
  width:100%;
  min-width:0;
  height:62px;
  display:flex;
  align-items:flex-start;
  justify-content:center;
}
.brand img{
  display:block;
  width:min(56vw,205px);
  max-width:205px;
  max-height:56px;
  height:auto;
  margin:0 auto;
  object-fit:contain;
}
.mic-btn{
  position:absolute;
  right:-5px;
  top:0;
  width:84px;
  height:84px;
  min-width:84px;
  min-height:84px;
  padding:0;
  border:4px solid #fff;
  border-radius:50%;
  background:var(--teal);
  color:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.2);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:0;
  font-size:1.85rem;
  font-weight:800;
  line-height:1;
}
.mic-btn .label{
  display:block;
  margin-top:1px;
  font-size:.9rem;
  font-weight:800;
  line-height:1;
}
.master-content{
  min-height:0;
  overflow:auto;
  overscroll-behavior:contain;
  padding:6px 0;
}
.content-placeholder{
  width:100%;
  min-height:100%;
  border:2px dashed var(--line);
  border-radius:18px;
  background:var(--bg);
}
.master-footer{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  align-items:end;
  padding-top:7px;
  border-top:1px solid #eef4f5;
}
.nav-btn{
  width:100%;
  height:50px;
  min-height:50px;
  margin:0;
  padding:7px 10px;
  border:3px solid var(--ink);
  border-radius:13px;
  background:#fff;
  color:#111;
  font-size:1rem;
  line-height:1.1;
  font-weight:800;
}
.nav-btn.next{
  background:var(--teal);
  color:#fff;
  border-color:var(--teal);
}
@media (max-width:540px){
  body{padding:1px}
  .master-shell{
    height:calc(100svh - 2px);
    border-radius:22px;
    padding:5px 10px 6px;
    grid-template-rows:78px minmax(0,1fr) 60px;
  }
  .master-header{
    min-height:78px;
    padding:0 78px 3px 38px;
  }
  .menu-btn{
    top:4px;
    width:36px;
    min-width:36px;
    height:50px;
    min-height:50px;
  }
  .brand{height:58px}
  .brand img{
    width:min(54vw,198px);
    max-width:198px;
    max-height:54px;
  }
  .mic-btn{
    right:-4px;
    width:80px;
    height:80px;
    min-width:80px;
    min-height:80px;
    font-size:1.75rem;
  }
  .mic-btn .label{font-size:.86rem}
  .master-content{padding:5px 0}
  .content-placeholder{border-radius:16px}
  .master-footer{gap:7px;padding-top:5px}
  .nav-btn{
    height:46px;
    min-height:46px;
    padding:6px 8px;
    border-radius:13px;
    font-size:.98rem;
  }
}
</style>
</head>
<body>
<main class="master-shell" aria-label="Modèle de cadre maître Libcomlair">
  <header class="master-header">
    <button class="menu-btn" type="button" aria-label="Menu">☰</button>
    <div class="brand"><img src="assets/libcomlair-logo-v222.jpg?v=224-clean-source" alt="Libcomlair — Sortir en toute liberté"></div>
    <button class="mic-btn" type="button" aria-label="Micro"><span>🎙️</span><span class="label">Micro</span></button>
  </header>

  <section class="master-content" aria-label="Zone réservée au contenu de la page">
    <div class="content-placeholder" aria-hidden="true"></div>
  </section>

  <footer class="master-footer">
    <button class="nav-btn" type="button">Retour</button>
    <button class="nav-btn next" type="button">Suivant</button>
  </footer>
</main>
</body>
</html>
