<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Libcomlair — modèle cadre maître v36</title>
<style>
:root{
  --ink:#17222b;
  --teal:#0f7784;
  --line:#94c7cc;
  --bg:#f7fbfb;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
body{min-height:100dvh;padding:2px}
.master-shell{
  width:100%;
  height:calc(100dvh - 4px);
  max-width:820px;
  margin:0 auto;
  border:3px solid var(--ink);
  border-radius:26px;
  background:#fff;
  display:grid;
  grid-template-rows:104px minmax(0,1fr) auto;
  overflow:hidden;
  padding:8px 12px 10px;
}
.master-header{
  position:relative;
  min-height:104px;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:0 94px 6px 44px;
  border-bottom:1px solid #eef4f5;
}
.menu-btn{
  position:absolute;
  left:0;
  top:4px;
  width:42px;
  min-width:42px;
  height:58px;
  min-height:58px;
  padding:0;
  border:0;
  border-radius:12px;
  background:var(--teal);
  color:#fff;
  font-size:1.35rem;
  line-height:1;
  box-shadow:0 5px 14px rgba(0,0,0,.14);
  display:flex;
  align-items:center;
  justify-content:center;
}
.brand{
  width:100%;
  min-width:0;
  min-height:66px;
  display:flex;
  align-items:flex-start;
  justify-content:center;
}
.brand img{
  display:block;
  width:min(58vw,215px);
  max-width:215px;
  max-height:58px;
  height:auto;
  margin:0 auto;
  object-fit:contain;
}
.mic-btn{
  position:absolute;
  right:-8px;
  top:0;
  width:100px;
  height:100px;
  min-width:100px;
  min-height:100px;
  padding:0;
  border:4px solid #fff;
  border-radius:50%;
  background:var(--teal);
  color:#fff;
  box-shadow:0 5px 16px rgba(0,0,0,.22);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:0;
  font-size:2.25rem;
  font-weight:800;
  line-height:1;
}
.mic-btn .label{display:block;margin-top:1px;font-size:1rem;font-weight:800;line-height:1}
.master-content{
  min-height:0;
  overflow:auto;
  overscroll-behavior:contain;
  padding:6px 0;
}
.content-placeholder{
  min-height:100%;
  border:2px dashed var(--line);
  border-radius:18px;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:18px;
}
.content-placeholder .box{max-width:520px}
.content-placeholder h1{margin:0 0 10px;font-size:clamp(26px,5vw,38px)}
.content-placeholder p{margin:0;font-size:clamp(17px,3.6vw,24px);line-height:1.3;color:#53636b}
.master-footer{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding-top:7px;
  border-top:1px solid #eef4f5;
}
.nav-btn{
  min-height:50px;
  margin:0;
  padding:9px 12px;
  border:3px solid var(--ink);
  border-radius:12px;
  background:#fff;
  color:#111;
  font-size:1.01rem;
  line-height:1.15;
  font-weight:800;
}
.nav-btn.next{background:var(--teal);color:#fff;border-color:var(--teal)}
@media (max-width:540px){
  body{padding:1px}
  .master-shell{
    height:calc(100dvh - 2px);
    border-radius:22px;
    padding:6px 10px 8px;
    grid-template-rows:104px minmax(0,1fr) auto;
  }
  .master-header{min-height:104px;padding:0 94px 4px 44px}
  .master-content{padding:4px 0 6px}
  .content-placeholder{border-radius:16px;padding:14px}
  .master-footer{gap:7px;padding-top:6px}
  .nav-btn{min-height:48px;padding:7px 9px;border-radius:13px;font-size:1rem}
}
</style>
</head>
<body>
<main class="master-shell" aria-label="Modèle de cadre maître Libcomlair">
  <header class="master-header">
    <button class="menu-btn" type="button" aria-label="Menu">☰</button>
    <div class="brand"><img src="assets/libcomlair-logo-v222.jpg?v=224-clean-source" alt="Libcomlair — Sortir en toute liberté"></div>
    <button class="mic-btn" type="button" aria-label="Micro"><span>🎙️</span><span class="label">Micro</span></button>
  </header>

  <section class="master-content" aria-label="Zone réservée au contenu de la page">
    <div class="content-placeholder">
      <div class="box">
        <h1>Zone de contenu</h1>
        <p>Le contenu de chaque page utilise uniquement cet espace central. Il peut défiler sans passer sous l’en-tête ni sous la navigation.</p>
      </div>
    </div>
  </section>

  <footer class="master-footer">
    <button class="nav-btn" type="button">Retour</button>
    <button class="nav-btn next" type="button">Suivant</button>
  </footer>
</main>
</body>
</html>
