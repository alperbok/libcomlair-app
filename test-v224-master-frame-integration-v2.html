(()=>{
  const state={createdAt:Date.now(),created:false,initialState:"none",currentState:"none",userActivation:!!navigator.userActivation?.isActive,resumeRequested:false,resumeResolved:false,resumeOk:false,error:""};
  window.__libcomlairEarlyAudioStatus=state;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(typeof AC!=="function"){state.error="audio-context-unavailable";return}
    const ctx=new AC();
    window.__libcomlairEarlyAudioContext=ctx;
    state.created=true;
    state.initialState=ctx.state;
    state.currentState=ctx.state;
    state.resumeRequested=true;
    window.__libcomlairEarlyAudioResumePromise=Promise.resolve(ctx.resume()).then(()=>{
      state.resumeResolved=true;
      state.currentState=ctx.state;
      state.resumeOk=ctx.state==="running";
      return state.resumeOk;
    }).catch(error=>{
      state.resumeResolved=true;
      state.currentState=ctx.state;
      state.error=String(error?.message||error||"");
      return false;
    });
  }catch(error){state.error=String(error?.message||error||"")}
})();
