<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Libcomlair — accueil propre v1</title>
<meta name="theme-color" content="#165f70">
<style>
  html,body{margin:0;padding:0;width:100%;min-height:100%;background:#eef7f8;overflow-x:hidden}
  #cleanAppFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;visibility:hidden;z-index:1}
  #libcomlairSplash{position:relative;z-index:20;width:100%;min-height:100vh;background:#eef7f8}
  .clean-welcome-screen{position:relative;width:100vw;max-width:941px;margin:0 auto;line-height:0;background:#eef7f8}
  .clean-welcome-image{display:block;width:100%;height:auto;border:0;margin:0;padding:0}
  #libcomlairSplashNext{
    position:absolute;
    left:6%;
    right:6%;
    bottom:2.9%;
    height:7.7%;
    box-sizing:border-box;
    margin:0;
    padding:0 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    appearance:none;
    -webkit-appearance:none;
    background:#027280;
    color:#fff;
    border:0;
    border-radius:26px;
    box-shadow:none;
    font:800 clamp(24px,5.5vw,40px)/1.1 Arial,sans-serif;
    text-align:center;
    cursor:pointer;
    z-index:30;
    -webkit-tap-highlight-color:transparent;
  }
  #libcomlairSplashNext[data-v224-welcome-stage="listen"]{padding-bottom:14px}
  #libcomlairSplashNext[data-v224-welcome-stage="loading"]{font-size:clamp(17px,4vw,27px);padding-bottom:0}
  #libcomlairSplashNext[data-v224-welcome-stage="next"]{
    background:transparent;
    color:transparent;
    padding-bottom:0;
  }
  #libcomlairSplashNext:focus-visible{outline:5px solid #ffca3a;outline-offset:3px}
  .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
</style>
</head>
<body>
<iframe id="cleanAppFrame" title="Application Libcomlair" src="test-v224-profile-compact.html?clean-entry-v1=1"></iframe>

<section id="libcomlairSplash" aria-labelledby="libcomlairSplashTitle">
  <div class="clean-welcome-screen">
    <h1 id="libcomlairSplashTitle" class="sr-only">Bienvenue dans Libcomlair</h1>
    <img class="clean-welcome-image" src="assets/libcomlair-welcome-v224.jpg?v=clean-entry-v1" alt="Bienvenue dans Libcomlair. Une personne en fauteuil roulant et une femme malvoyante avec une canne blanche et son chien guide se déplacent dans une ville accessible.">
    <button id="libcomlairSplashNext" type="button" aria-label="Ouvrir Libcomlair et écouter le message de bienvenue">Ouvrir</button>
  </div>
</section>

<script src="libcomlair-render-voice-v196-historical.js?v=clean1"></script>
<script src="libcomlair-voice-engine-v191-historical.js?v=clean1"></script>
<script src="libcomlair-v224-welcome-open-historical.js?v=clean1"></script>
<script>
(()=>{
  const splash=document.getElementById('libcomlairSplash');
  const button=document.getElementById('libcomlairSplashNext');
  const frame=document.getElementById('cleanAppFrame');
  let frameReady=false;
  let entering=false;

  frame.addEventListener('load',()=>{frameReady=true});

  function enterApp(){
    if(entering)return;
    entering=true;
    try{window.LibcomlairVoice?.cancel?.()}catch(_){}
    const reveal=()=>{
      try{
        const doc=frame.contentDocument;
        const innerNext=doc&&doc.getElementById('libcomlairSplashNext');
        if(innerNext)innerNext.click();
      }catch(_){}
      frame.style.visibility='visible';
      splash.hidden=true;
      document.body.style.overflow='hidden';
    };
    if(frameReady)reveal();
    else frame.addEventListener('load',reveal,{once:true});
  }

  button.addEventListener('click',()=>{
    const stage=window.LibcomlairWelcomeListenFirst?.stage?.();
    if(stage==='next')enterApp();
  },false);
})();
</script>
</body>
</html>
