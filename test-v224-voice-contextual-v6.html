<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Libcomlair — test commandes courtes v6</title>
</head>
<body>
<p>Chargement de Libcomlair…</p>
<script>
(async()=>{
  const source="test-v224-profile-compact.html?voice-contextual-source=69";
  try{
    let html=await fetch(source,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()});

    html=html.replace(
      /<script src="libcomlair-v222-accessible-home\.js\?v=[^"]+"><\/script>/,
      '<script src="libcomlair-v224-voice-router.js?v=7"><\/script><script src="libcomlair-v224-profile-simple-actions.js?v=3"><\/script>'
    );
    html=html.replace("</head>",'<link rel="stylesheet" href="libcomlair-v224-global-assistance.css?v=7"></head>');
    const extras='<script src="libcomlair-v224-global-assistance.js?v=7"><\/script><script src="libcomlair-v224-regression-guard.js?v=7"><\/script>';
    html=html.replace("</body>",extras+"</body>");
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML="<h1>Libcomlair</h1><p>Impossible de charger la version de test.</p><pre></pre>";
    document.querySelector("pre").textContent=String(err&&err.message||err);
  }
})();
</script>
</body>
</html>
